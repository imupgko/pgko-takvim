<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGKO Proje Çağrıları Tarih Şeridi</title>

  <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment-with-locales.min.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --tubitak-color: #1d4ed8;
      --tuseb-color: #b91c1c;
      --istka-color: #7c3aed;
      --ab-color: #d97706;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-group, .action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .btn {
      padding: 5px 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      background: #f9fafb;
      color: var(--text-color);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover { background: #f3f4f6; }
    .btn.active { background: #111827; color: #ffffff; border-color: #111827; }

    .btn-tubitak.active { background: var(--tubitak-color); border-color: var(--tubitak-color); }
    .btn-tuseb.active   { background: var(--tuseb-color); border-color: var(--tuseb-color); }
    .btn-istka.active   { background: var(--istka-color); border-color: var(--istka-color); }
    .btn-ab.active      { background: var(--ab-color); border-color: var(--ab-color); }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      margin-right: 6px;
    }

    #timeline {
      width: 100%;
      min-height: 300px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .vis-item {
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-width: 1px;
    }

    .vis-item .vis-item-content {
      padding: 2px 6px;
      line-height: 1.2;
    }

    .vis-label,
    .vis-time-axis .vis-text {
      font-size: 11px;
    }

    .vis-item.item-tubitak { background-color: #dbeafe; border-color: var(--tubitak-color); color: #1e3a8a; }
    .vis-item.item-tuseb   { background-color: #fee2e2; border-color: var(--tuseb-color); color: #7f1d1d; }
    .vis-item.item-istka   { background-color: #f3e8ff; border-color: var(--istka-color); color: #5b21b6; }
    .vis-item.item-ab      { background-color: #fef3c7; border-color: var(--ab-color); color: #78350f; }

    .vis-item.item-surekli {
      border-style: dashed;
      border-width: 2px;
      opacity: 0.92;
    }

    .vis-item:hover { filter: brightness(0.95); }

    .hint {
      margin-top: 8px;
      font-size: 10px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="filter-group" id="kurumFiltreleri">
      <button class="btn active" data-kurum="ALL">Tümü</button>
      <button class="btn btn-tubitak" data-kurum="TÜBİTAK">TÜBİTAK</button>
      <button class="btn btn-tuseb" data-kurum="TÜSEB">TÜSEB</button>
      <button class="btn btn-istka" data-kurum="İSTKA">İSTKA</button>
      <button class="btn btn-ab" data-kurum="AB">AB Projeleri</button>
    </div>

    <div class="action-group">
      <label class="toggle-label">
        <input type="checkbox" id="sadeceAcik" checked />
        Sadece Açık Çağrılar
      </label>
      <button class="btn" id="btnBugun">Bugün</button>
      <button class="btn" id="btnYil">Yıllık Görünüm</button>
    </div>
  </div>

  <div id="timeline"></div>
  <div class="hint">Çağrı detaylarına gitmek için ilgili zaman çubuğuna tıklayabilirsiniz.</div>

  <script>
    let allCalls = [];
    let selectedKurum = "ALL";
    let timeline = null;
    const itemsDataSet = new vis.DataSet();

    const groups = new vis.DataSet([
      { id: "TÜBİTAK", content: "<strong>TÜBİTAK</strong>" },
      { id: "TÜSEB", content: "<strong>TÜSEB</strong>" },
      { id: "İSTKA", content: "<strong>İSTKA</strong>" },
      { id: "AB", content: "<strong>AB Projeleri</strong>" }
    ]);

    function getClassName(kurum) {
      if (kurum === "TÜBİTAK") return "item-tubitak";
      if (kurum === "TÜSEB") return "item-tuseb";
      if (kurum === "İSTKA") return "item-istka";
      if (kurum === "AB") return "item-ab";
      return "";
    }

    function formatDateTR(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString("tr-TR", { day: "2-digit", month: "long", year: "numeric" });
    }

    function updateAlwaysOpenItems() {
      if (!timeline) return;
      const win = timeline.getWindow();
      const span = win.end.getTime() - win.start.getTime();
      const visualStart = new Date(win.start.getTime() + span * 0.02);
      const visualEnd = new Date(win.start.getTime() + span * 0.28);

      const updates = [];
      itemsDataSet.forEach(item => {
        if (item.surekli_acik) {
          updates.push({ id: item.id, start: visualStart, end: visualEnd });
        }
      });

      if (updates.length > 0) {
        itemsDataSet.update(updates);
      }
    }

    function renderFilteredData() {
      const onlyOpen = document.getElementById("sadeceAcik").checked;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const filtered = allCalls.filter(call => {
        const matchKurum = selectedKurum === "ALL" || call.kurum === selectedKurum;
        if (call.surekli_acik) return matchKurum;
        const endDate = new Date(call.bitis);
        const matchStatus = !onlyOpen || endDate >= today;
        return matchKurum && matchStatus;
      });

      const defaultEnd = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);

      const visItems = filtered.map(call => {
        const isAlwaysOpen = Boolean(call.surekli_acik);
        const dateInfo = isAlwaysOpen
          ? "Durum: <strong>Sürekli Başvuruya Açık</strong>"
          : `Başlangıç: ${formatDateTR(call.baslangic)}<br>Bitiş: ${formatDateTR(call.bitis)}`;

        return {
          id: call.id,
          group: call.kurum,
          content: isAlwaysOpen ? `∞ ${call.baslik}` : call.baslik,
          start: isAlwaysOpen ? today : call.baslangic,
          end: isAlwaysOpen ? defaultEnd : call.bitis,
          surekli_acik: isAlwaysOpen,
          className: getClassName(call.kurum) + (isAlwaysOpen ? " item-surekli" : ""),
          url: call.url,
          title: `<strong>${call.kurum}</strong><br>${call.baslik}${call.program_adi ? `<br><em>${call.program_adi}</em>` : ""}<br>${dateInfo}`
        };
      });

      itemsDataSet.clear();
      itemsDataSet.add(visItems);

      if (timeline && visItems.length > 0) {
        timeline.fit({ animation: false });
        updateAlwaysOpenItems();

        setTimeout(() => {
          requestAnimationFrame(() => {
            const activeGroups = new Set(visItems.map(item => item.group));
            const allGroups = groups.get().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            const firstFilledIndex = allGroups.findIndex(g => activeGroups.has(g.id));
            const labels = document.querySelectorAll("#timeline .vis-labelset .vis-label");
            const scrollEl = document.querySelector("#timeline .vis-vertical-scroll");

            if (scrollEl && firstFilledIndex >= 0) {
              scrollEl.scrollTop = firstFilledIndex === 0 ? 0 : (labels[firstFilledIndex]?.offsetTop ?? 0);
              scrollEl.dispatchEvent(new Event("scroll"));
            }
          });
        }, 150);
      }
    }

    async function initTimeline() {
      const container = document.getElementById("timeline");

      const options = {
        locale: "tr",
        moment: function (date) { return moment(date).locale("tr"); },
        stack: true,
        verticalScroll: true,
        horizontalScroll: false,
        zoomKey: "ctrlKey",
        zoomMin: 1000 * 60 * 60 * 24 * 7,
        zoomMax: 1000 * 60 * 60 * 24 * 365 * 3,
        maxHeight: "440px",
        margin: { item: 5, axis: 4 },
        tooltip: { followMouse: true, overflowMethod: "cap" }
      };

      timeline = new vis.Timeline(container, itemsDataSet, groups, options);

      timeline.on("rangechange", updateAlwaysOpenItems);

      timeline.on("select", function (props) {
        if (props.items.length > 0) {
          const item = itemsDataSet.get(props.items[0]);
          if (item && item.url) window.open(item.url, "_blank", "noopener,noreferrer");
        }
      });

      try {
        const response = await fetch("./cagrilar.json?t=" + Date.now());
        if (!response.ok) throw new Error("JSON yüklenemedi");
        allCalls = await response.json();
        renderFilteredData();
      } catch (err) {
        container.innerHTML = "<p style='padding:12px;color:#b91c1c;font-size:12px;'>Veri dosyası (cagrilar.json) yüklenirken hata oluştu.</p>";
        console.error(err);
      }
    }

    document.querySelectorAll("#kurumFiltreleri .btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#kurumFiltreleri .btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedKurum = btn.dataset.kurum;
        renderFilteredData();
      });
    });

    document.getElementById("sadeceAcik").addEventListener("change", renderFilteredData);

    document.getElementById("btnBugun").addEventListener("click", () => {
      if (timeline) timeline.moveTo(new Date(), { animation: true });
    });

    document.getElementById("btnYil").addEventListener("click", () => {
      if (!timeline) return;
      const now = new Date();
      timeline.setWindow(new Date(now.getFullYear(), now.getMonth() - 1, 1), new Date(now.getFullYear(), now.getMonth() + 11, 1), { animation: true });
    });

    initTimeline();
  </script>
</body>
</html>
