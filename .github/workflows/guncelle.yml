name: Proje Çağrılarını Güncelle

on:
  schedule:
    # Her gün Türkiye saatiyle 09:00 (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # İstediğiniz zaman elle tetikleyebilmek için

permissions:
  contents: write

jobs:
  update-calls:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli kütüphaneleri yükle
        run: pip install requests beautifulsoup4 pypdf

      - name: Çağrıları ve ödülleri çek
        run: |
          python fetch_calls.py
          python fetch_awards.py

      - name: Değişiklik varsa kaydet
        run: |
          git config --global user.name "PGKO Bot"
          git config --global user.email "bot@pgko.local"
          git add cagrilar.json oduller.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik çağrı ve ödül güncellemesi" && git push)
